<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard do Clima</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="container">

    <h1>🌤 Dashboard do Clima</h1>

    <section class="search-box">
      <input
        type="text"
        id="city-input"
        placeholder="Digite uma cidade..."
      >

      <button id="search-btn">
        Buscar
      </button>
    </section>

    <section id="weather-card">

      <div class="city-info">
        
      </div>

      <div class="temperature">
        <span id="temperature">--°C</span>
      </div>

      <div class="weather-details">

        <div class="detail">
          <h3>💧 Umidade</h3>
          <p id="humidity">--%</p>
        </div>

        <div class="detail">
          <h3>🌬 Vento</h3>
          <p id="wind-speed">-- km/h</p>
        </div>

        <div class="detail">
          <h3>🌡 Sensação</h3>
          <p id="feels-like">--°C</p>
        </div>

      </div>

    </section>

  </main>

  <script src="script.js"></script>

</body>
</html>
